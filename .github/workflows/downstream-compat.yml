name: Downstream compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer \
            --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --dry-run

  disposable-distribution:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs: upstream-tests
    steps:
      - name: Check out adapter
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the reviewed Pi baseline
        run: >-
          npm install --prefix _pi --no-package-lock
          @earendil-works/pi-coding-agent@0.84.4
      - name: Verify install, update, rollback, and stable return
        env:
          PI_INSTALL_ROOT: ${{ github.workspace }}/_pi
          PI_EXPECTED_STABLE_SHA: ${{ github.sha }}
        run: node downstream/verify-distribution.mjs
