name: Downstream compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer \
            --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --dry-run

  workbench-compat:
    runs-on: ubuntu-latest
    needs: upstream-tests
    steps:
      - name: Check out adapter
        uses: actions/checkout@v4
      - name: Check out reviewed Workbench baseline
        uses: actions/checkout@v4
        with:
          repository: h1057399903-web/pi-plugin-workbench
          ref: f52fb17421d6183618d1475cc3257d3ab3ccffb4
          path: _workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _workbench/package-lock.json
      - run: npm ci
      - run: npm ci --prefix _workbench
      - name: Verify Pi can load both extension packages
        env:
          PI_WORKBENCH_DIR: ${{ github.workspace }}/_workbench
        run: node downstream/verify-pi-compat.mjs

  disposable-distribution:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs: [upstream-tests, workbench-compat]
    steps:
      - name: Check out adapter
        uses: actions/checkout@v4
      - name: Check out reviewed Workbench baseline
        uses: actions/checkout@v4
        with:
          repository: h1057399903-web/pi-plugin-workbench
          ref: f52fb17421d6183618d1475cc3257d3ab3ccffb4
          path: _workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix _workbench
      - name: Verify install, update, rollback, and stable return
        env:
          PI_WORKBENCH_DIR: ${{ github.workspace }}/_workbench
          PI_EXPECTED_STABLE_SHA: ${{ github.sha }}
        run: node downstream/verify-distribution.mjs
